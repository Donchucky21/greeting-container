name: Container CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Build image
        run: docker build -t greeting-container:ci .

      - name: Start container
        id: start
        run: |
          docker run -d --name greeting-ci \
            -p 127.0.0.1:8080:8080 \
            greeting-container:ci

      - name: Test application
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 http://localhost:8080/healthz
          curl --fail --max-time 5 http://localhost:8080/
          curl --fail --max-time 5 http://localhost:8080/info

      - name: Verify non-root user
        run: |
          docker exec greeting-ci id
          test "$(docker exec greeting-ci id -u)" -ne 0

      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: greeting-container:ci
          scanners: vuln
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Block fixable high and critical vulnerabilities
        run: |
          trivy image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 \
            greeting-container:ci

      - name: Show logs and remove container
        if: ${{ always() && steps.start.outcome == 'success' }}
        run: |
          docker logs greeting-ci
          docker rm -f greeting-ci
          